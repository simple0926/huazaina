<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"paper";</script>
<title>封面 · 月结单版</title>
<link rel="stylesheet" href="ui.css">
<style>
  .cover { display: flex; flex-direction: column; height: 100%; padding: 0 18px; }
  .cover .brandline { padding-top: 18px; }
  .cover .masthead { margin-top: auto; margin-bottom: auto; }
  .cover .title {
    margin-top: 0;
    font-family: var(--serif);
    font-size: 41px;
    line-height: 1.28;
    letter-spacing: -.01em;
    font-weight: 500;
  }
  .cover .title .thin { color: var(--ink-3); }
  .cover .rule { height: 2px; background: var(--ink); margin-top: 22px; }
  .cover .sub { margin-top: 14px; font-size: 13px; line-height: 1.8; color: var(--ink-2); }
  .cover .principles {
    display: grid; grid-template-columns: repeat(3, 1fr);
    margin-bottom: 18px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  }
  .cover .principles div { padding: 11px 8px 12px 0; font-size: 11px; color: var(--ink-3); letter-spacing: .06em; }
  .cover .principles div + div { padding-left: 10px; border-left: 1px solid var(--rule); }
  .cover .principles b { display: block; margin-bottom: 3px; font-size: 12px; font-weight: 500; color: var(--ink); letter-spacing: .02em; }
  .cover .cta { width: 100%; height: 52px; background: var(--ink); color: var(--paper); font-size: 15px; letter-spacing: .14em; display: flex; align-items: center; justify-content: center; }
  .cover .ghost { margin-top: 12px; text-align: center; font-size: 12px; color: var(--ink-3); padding-bottom: 24px; }
</style>
</head>
<body>
<div class="cover">
  <div class="brandline">
    <span class="brand">花在哪 / PRIVATE LEDGER</span>
    <span class="seal-big">账</span>
  </div>

  <div class="masthead">
    <h1 class="title">钱花在哪，<br><span class="thin">你说了算。</span></h1>
    <div class="rule"></div>
    <p class="sub">没有账号，没有云同步，没有会员费。<br>每一笔只在本机，随时能导出。</p>
  </div>

  <div class="principles">
    <div><b>01</b>无账号</div>
    <div><b>02</b>无网络</div>
    <div><b>03</b>可导出</div>
  </div>

  <button class="cta">开始记账</button>
  <div class="ghost">先看示例数据 →</div>
</div>
</body>
</html>
