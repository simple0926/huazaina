<!DOCTYPE html>
<html lang="zh-CN" data-store="huazaina-v1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F1EEE0">
<title>花在哪</title>
<link rel="icon" href="data:,">
<style>
/* 花在哪 · 界面样式 */
:root {
  --paper: #F1EEE0;
  --paper-2: #E8E3D2;
  --paper-3: #DDD5C0;
  --card: #F7F5EB;
  --ink: #1A2018;
  --ink-2: #4D5247;
  --ink-3: #6A6A59;
  --ink-4: #8A8574;
  --accent: #2F5A43;
  --accent-soft: rgba(47, 90, 67, .10);
  --on-accent: #F1EEE0;
  --warn: #A3472F;
  --danger: #963A2A;
  --red: #A3472F;
  --red-soft: #F0DDD5;
  --line: rgba(26, 32, 24, .17);
  --line-soft: rgba(26, 32, 24, .10);
  --shadow: none;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  --serif: "Songti SC", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif", serif;
  --ease: cubic-bezier(.2, .7, .3, 1);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background: var(--paper);
  overflow: hidden;
  overscroll-behavior: none;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
svg { display: block; }
h1, h2, h3 { margin: 0; font-weight: 600; }

#app {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
  padding-top: var(--safe-t);
  background:
    radial-gradient(120% 60% at 100% 0%, rgba(184, 60, 40, .035), transparent 60%),
    var(--paper);
}

/* ---------- 顶栏 ---------- */
.top {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px 8px;
}
.top-main { min-width: 0; flex: 1; }
.top-title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: .01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.top-sub {
  margin-top: 2px;
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: .02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.icon-btn {
  position: relative;
  flex: 0 0 auto;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 50%;
  color: var(--ink-2);
  transition: background .16s var(--ease), transform .16s var(--ease);
}
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn:active { background: var(--paper-2); transform: scale(.94); }

/* ---------- 视图 ---------- */
#main { position: relative; flex: 1 1 auto; min-height: 0; }
.view {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  min-height: 0;
}
.view.is-on { display: flex; animation: viewIn .22s var(--ease) both; }
.view[data-view="add"] { overflow-y: auto; overflow-x: hidden; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- 记账 ---------- */
.amount-block { flex: 0 0 auto; padding: 10px 20px 0; }
.amount {
  display: flex;
  align-items: baseline;
  gap: 4px;
  height: 64px;
  font-family: var(--serif);
  font-variant-numeric: tabular-nums lining-nums;
  letter-spacing: -.015em;
  transition: color .2s;
}
.amount-cur { font-size: 22px; color: var(--ink-3); transform: translateY(-2px); }
.amount-val { font-size: 54px; font-weight: 500; line-height: 1; }
.amount-val.zero { color: var(--ink-4); }
.amount.sm .amount-val { font-size: 40px; }
.amount.xs .amount-val { font-size: 32px; }
.caret {
  width: 2px; height: 34px;
  margin-left: 2px;
  background: var(--red);
  align-self: center;
  border-radius: 2px;
  animation: blink 1.05s steps(1) infinite;
}
.amount.zero .caret { opacity: .45; }
@keyframes blink { 50% { opacity: 0; } }
.amount-hint {
  height: 18px;
  font-size: 11.5px;
  color: var(--ink-3);
  letter-spacing: .03em;
  padding-left: 2px;
}
.amount-hint.warn { color: var(--red); }

.cats {
  flex: 0 1 auto;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  padding: 8px 12px 0;
  overflow-y: auto;
  max-height: 200px;
  scrollbar-width: none;
}
.cats::-webkit-scrollbar { display: none; }
.cat {
  position: relative;
  height: 68px;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  color: var(--ink-2);
  transition: background .18s var(--ease), color .18s var(--ease), transform .12s var(--ease);
}
.cat:active { transform: scale(.95); }
.cat-ico { width: 30px; height: 30px; color: var(--c, var(--ink)); }
.cat-ico svg { width: 100%; height: 100%; }
.cat-name { font-size: 11.5px; letter-spacing: .02em; }
.cat.on { background: var(--ink); color: var(--paper); }
.cat.on .cat-ico { color: var(--paper); }


.meta {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  padding: 12px 16px 0;
}
.meta-btn {
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 11px;
  font-size: 12.5px;
  color: var(--ink-2);
  background: rgba(255, 253, 247, .45);
  transition: background .16s, border-color .16s, transform .12s;
}
.meta-btn:active { background: var(--paper-2); transform: scale(.97); }
.meta-btn svg { width: 15px; height: 15px; color: var(--ink-3); }
.meta-btn.is-set { border-color: rgba(27,24,21,.22); color: var(--ink); }
.meta-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 78px; }

.pad {
  flex: 1 1 auto;
  min-height: 208px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 4px 8px;
  padding: 8px 12px 4px;
}
.key {
  border-radius: 12px;
  background: rgba(255, 253, 247, .62);
  border: 1px solid var(--line-soft);
  font-size: 21px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  transition: background .13s var(--ease), transform .1s var(--ease);
}
.key:active { background: var(--paper-3); transform: scale(.96); }
.key-back { display: grid; place-items: center; color: var(--ink-2); }
.key-back { display: grid; place-items: center; color: var(--ink-2); }
.key-back svg { width: 23px; height: 23px; }

.save {
  flex: 0 0 auto;
  margin: 4px 16px 10px;
  height: 52px;
  border-radius: 14px;
  background: var(--ink);
  color: var(--paper);
  font-size: 15.5px;
  font-weight: 600;
  letter-spacing: .06em;
  transition: opacity .2s, transform .12s var(--ease), background .2s;
}
.save:active:not(:disabled) { transform: scale(.985); background: #000; }
.save:disabled { background: var(--paper-3); color: var(--ink-4); cursor: default; }
.save.is-done { background: var(--red); }

/* ---------- 底部导航 ---------- */
.tabbar {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  align-items: start;
  padding: 5px 10px calc(6px + var(--safe-b));
  border-top: 1px solid var(--line-soft);
  background: rgba(245, 240, 229, .96);
}
.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding-top: 2px;
  font-size: 11px;
  letter-spacing: .06em;
  color: var(--ink-3);
  transition: color .18s;
}
.tab-ico {
  display: grid; place-items: center;
  width: 52px; height: 26px;
  border-radius: 9px;
  transition: background .2s var(--ease), color .18s;
}
.tab-ico svg { width: 21px; height: 21px; }
.tab.is-on { color: var(--ink); font-weight: 600; }
.tab.is-on .tab-ico { background: var(--paper-3); }
.tab:active .tab-ico { background: var(--paper-3); }

.mb-btn::after, .icon-btn::after, .sheet-close::after, .cal-nav::after {
  content: "";
  position: absolute;
  inset: -5px -3px;
  border-radius: 12px;
}

/* ---------- 明细 ---------- */
.month-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 12px 8px;
}
.mb-btn {
  position: relative;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 10px;
  color: var(--ink-2);
  transition: background .15s;
}
.mb-btn svg { width: 18px; height: 18px; }
.mb-btn:active { background: var(--paper-2); }
.mb-btn:disabled { opacity: .25; }
.mb-main { flex: 1; min-width: 0; padding-left: 2px; }
.mb-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .01em;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.mb-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
.mb-sub b { font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.search-row {
  flex: 0 0 auto;
  display: flex;
  gap: 8px;
  padding: 0 16px 8px;
}
.search-input {
  flex: 1;
  height: 36px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(255,253,247,.6);
  padding: 0 12px;
  font-size: 13.5px;
  color: var(--ink);
}
.search-input::placeholder { color: var(--ink-4); }

.chips {
  flex: 0 0 auto;
  display: flex;
  gap: 7px;
  padding: 2px 40px 8px 16px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent);
  mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent);
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  height: 34px;
  padding: 0 12px;
  border-radius: 9px;
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--ink-2);
  display: flex; align-items: center; gap: 5px;
  background: transparent;
  transition: background .16s, color .16s, border-color .16s;
}
.chip i { width: 5px; height: 5px; border-radius: 50%; background: var(--c, var(--ink-3)); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip.on i { background: var(--paper); }
.chip:active { transform: scale(.97); }

.scroll { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 16px; }
.scroll::-webkit-scrollbar { display: none; }

.day { padding: 0 16px; }
.day-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 14px 2px 6px;
}
.day-date { font-size: 12px; color: var(--ink-3); letter-spacing: .03em; }
.day-date b { color: var(--ink-2); font-weight: 500; }
.day-total { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rows { border-radius: 14px; background: rgba(255,253,247,.55); border: 1px solid var(--line-soft); overflow: hidden; }
.row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  text-align: left;
  background: transparent;
  transition: background .14s;
}
.row + .row { border-top: 1px solid var(--line-soft); }
.row:active { background: var(--paper-2); }
.row-ico {
  flex: 0 0 auto;
  width: 32px; height: 32px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--c-soft, var(--paper-2));
  color: var(--c, var(--ink));
}
.row-ico svg { width: 17px; height: 17px; }
.row-main { flex: 1; min-width: 0; }
.row-name { display: block; font-size: 14px; font-weight: 500; letter-spacing: .01em; }
.row-note { display: block; font-size: 12px; color: var(--ink-3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-amt {
  font-size: 14.5px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: .01em;
  color: var(--ink);
}

.empty-page { min-height: 56vh; }
.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 24px;
  text-align: center;
}
.empty-mark { width: 74px; height: 74px; color: var(--ink-4); opacity: .8; margin-bottom: 8px; }
.empty-title { font-size: 14.5px; font-weight: 500; }
.empty-text { font-size: 12px; color: var(--ink-3); max-width: 240px; line-height: 1.6; }
.empty-actions { display: flex; gap: 8px; margin-top: 14px; }
.empty-btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 500; }
.empty-btn {
  margin-top: 0;
  height: 38px; padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  font-size: 13px;
  color: var(--ink-2);
  background: var(--card);
}

/* ---------- 报告 ---------- */
.report-top { flex: 0 0 auto; padding: 0 16px 4px; }
.seg {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  height: 38px;
  padding: 3px;
  border-radius: 11px;
  background: var(--paper-2);
}
.seg-ind {
  position: absolute;
  top: 3px; left: 3px;
  width: calc((100% - 6px) / 4);
  height: 32px;
  border-radius: 8px;
  background: var(--card);
  box-shadow: 0 1px 2px rgba(46,36,16,.09);
  transition: transform .26s var(--ease);
}
.seg button {
  position: relative;
  z-index: 1;
  font-size: 12.5px;
  color: var(--ink-3);
  letter-spacing: .05em;
  transition: color .2s;
}
.seg button.on { color: var(--ink); font-weight: 600; }

.period-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 8px 0 2px;
}
.pn-label {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .02em;
  display: flex; align-items: baseline; gap: 7px;
}
.pn-today {
  font-size: 10.5px;
  color: var(--red);
  border: 1px solid rgba(184,60,40,.3);
  border-radius: 6px;
  padding: 1px 5px;
  letter-spacing: .04em;
}

.hero { padding: 10px 0 2px; }
.hero-label { font-size: 11px; color: var(--ink-3); letter-spacing: .18em; }
.hero-num {
  font-family: var(--serif);
  font-variant-numeric: tabular-nums lining-nums;
  font-size: 39px;
  line-height: 1.12;
  letter-spacing: -.01em;
  margin-top: 2px;
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.hero-num small { font-size: 19px; color: var(--ink-3); }
.hero-num b { font-weight: 500; }
.hero-meta {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  color: var(--ink-3);
  margin-top: 3px;
  flex-wrap: wrap;
}
.hero-meta i { width: 1px; height: 9px; background: var(--line); }
.delta {
  display: inline-flex; align-items: center; gap: 2px;
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 6px;
  background: var(--paper-2);
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.delta.up { color: var(--red); background: var(--red-soft); }
.delta.down { color: #426B4A; background: #E1E8DA; }

.card {
  margin: 12px 16px 0;
  padding: 14px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--line-soft);
  box-shadow: var(--shadow);
}
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.card-title { font-size: 13.5px; font-weight: 600; letter-spacing: .03em; }
.card-sub { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.chart { display: flex; align-items: flex-end; gap: 2px; height: 108px; margin-top: 2px; }
.chart-x { display: flex; gap: 2px; }
.chart-x span { flex: 1 1 0; min-width: 0; text-align: center; }
.chart-col {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  height: 100%;
  position: relative;
}
.chart-bar {
  width: 100%;
  max-width: 14px;
  border-radius: 3px 3px 1px 1px;
  background: var(--paper-3);
  transform-origin: bottom;
  animation: grow .5s var(--ease) both;
}
.chart--sparse .chart-bar { max-width: 40px; border-radius: 4px 4px 1px 1px; }
.chart-bar.max { background: var(--ink); }
.chart-bar.today { background: var(--red); }
@keyframes grow { from { transform: scaleY(.02); opacity: .4; } to { transform: none; opacity: 1; } }
.chart-x {
  height: 16px;
  display: flex;
  align-items: flex-end;
  font-size: 10px;
  color: var(--ink-3);
  white-space: nowrap;
}
.chart-x span { visibility: hidden; }
.chart-x span.show { visibility: visible; }
.chart-axis {
  display: flex; justify-content: space-between;
  font-size: 9.5px; color: var(--ink-4);
  padding: 6px 1px 0;
  border-top: 1px solid var(--line-soft);
}
.chart-empty {
  height: 108px;
  display: grid; place-items: center;
  font-size: 11.5px; color: var(--ink-4);
}

.donut-row { display: flex; align-items: center; gap: 14px; }
.donut { position: relative; flex: 0 0 auto; width: 108px; height: 108px; }
.donut svg { width: 108px; height: 108px; transform: rotate(-90deg); }
.donut circle { fill: none; stroke-width: 13; }
.donut-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0;
}
.donut-center b { font-family: var(--serif); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.donut-center span { font-size: 9.5px; color: var(--ink-3); letter-spacing: .04em; }
.legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); min-width: 0; }
.legend-item i { width: 7px; height: 7px; border-radius: 2px; flex: 0 0 auto; background: var(--c); }
.legend-item b { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink-3); }

.rank-list { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
.rank-row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: 9px;
  overflow: hidden;
  background: rgba(27,24,21,.045);
}
.rank-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9px 0 0 9px; background: var(--c-soft); opacity: .9; }
.rank-ico { position: relative; width: 22px; height: 22px; color: var(--c); }
.rank-ico svg { width: 100%; height: 100%; }
.rank-name { position: relative; font-size: 12.5px; }
.rank-pct { position: relative; font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: auto; }
.rank-amt { position: relative; font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 68px; text-align: right; }

.pay-bar { display: flex; height: 9px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--paper-2); }
.pay-seg { height: 100%; background: var(--c); animation: growX .55s var(--ease) both; transform-origin: left; }
@keyframes growX { from { transform: scaleX(0); } to { transform: none; } }
.pay-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 11px; }
.pay-item { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-2); }
.pay-item i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.pay-item b { font-weight: 500; font-variant-numeric: tabular-nums; }

.insight {
  margin: 12px 16px 0;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--paper-2);
  border-left: 3px solid var(--red);
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--ink-2);
}
.insight b { color: var(--ink); font-weight: 600; }

.report-note { padding: 14px 16px 22px; font-size: 10.5px; color: var(--ink-4); text-align: center; letter-spacing: .03em; }

/* ---------- 弹层 ---------- */
.scrim {
  position: fixed; inset: 0;
  background: rgba(24, 20, 15, .42);
  opacity: 0;
  pointer-events: none;
  transition: opacity .26s var(--ease);
  z-index: 40;
}
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  max-height: 90dvh;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -8px 40px rgba(30, 22, 8, .18);
  transform: translateY(102%);
  visibility: hidden;
  transition: transform .34s cubic-bezier(.16,.84,.44,1), visibility .34s;
}
.sheet.on { transform: none; visibility: visible; }
.sheet-grip { width: 34px; height: 4px; border-radius: 2px; background: var(--paper-3); margin: 8px auto 2px; flex: 0 0 auto; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 14px 8px 20px; flex: 0 0 auto; }
.sheet-head h2 { font-size: 16px; font-weight: 600; letter-spacing: .02em; }
.sheet-close { position: relative; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-3); }
.sheet-close svg { width: 17px; height: 17px; }
.sheet-close:active { background: var(--paper-2); }
.sheet-body { overflow-y: auto; padding: 0 20px calc(16px + var(--safe-b)); flex: 1 1 auto; overscroll-behavior: contain; }
.sheet-foot {
  flex: 0 0 auto;
  padding: 10px 20px calc(14px + var(--safe-b));
  display: flex;
  gap: 10px;
  background: linear-gradient(to top, var(--paper) 70%, rgba(245,240,229,0));
}
.sheet-foot:empty { display: none; }

/* ---------- 表单 ---------- */
.field { margin-top: 14px; }
.field-label { font-size: 10.5px; color: var(--ink-3); letter-spacing: .12em; margin-bottom: 6px; }
.input {
  width: 100%;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  padding: 0 12px;
  font-size: 14px;
  color: var(--ink);
}
.input::placeholder { color: var(--ink-4); }
.input-num { font-size: 22px; font-variant-numeric: tabular-nums; height: 52px; font-family: var(--serif); }
.quick { display: flex; gap: 7px; margin-top: 8px; flex-wrap: wrap; }
.quick button {
  height: 28px; padding: 0 11px;
  border-radius: 8px;
  border: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--ink-2);
  background: var(--card);
}
.quick button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pick {
  height: 34px;
  padding: 0 11px;
  border-radius: 9px;
  border: 1px solid var(--line);
  display: flex; align-items: center; gap: 6px;
  font-size: 12.5px;
  color: var(--ink-2);
  background: var(--card);
}
.pick svg { width: 16px; height: 16px; color: var(--c, var(--ink-3)); }
.pick i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.pick.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.pick.on svg { color: var(--paper); }
.pick.on i { background: var(--paper); }

/* 日历 */
.cal { padding-top: 2px; padding-bottom: 10px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; }
.cal-title { font-size: 14px; font-weight: 600; }
.cal-nav { position: relative; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; color: var(--ink-2); }
.cal-nav svg { width: 16px; height: 16px; }
.cal-nav:active { background: var(--paper-2); }
.cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-week span { text-align: center; font-size: 11px; color: var(--ink-3); padding-bottom: 6px; }
.cal-cell {
  height: 34px;
  border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  position: relative;
}
.cal-cell.dim { color: var(--ink-4); opacity: .45; }
.cal-cell.future { color: var(--ink-4); opacity: .28; }
.cal-cell.today::after {
  content: ""; position: absolute; bottom: 5px;
  width: 4px; height: 4px; border-radius: 50%; background: var(--red);
}
.cal-cell.on { background: var(--ink); color: var(--paper); }
.cal-cell.on::after { background: var(--paper); }
.cal-cell.sel-in { background: var(--paper-2); }

/* 设置 */
.group { margin-top: 18px; }
.group-label { font-size: 11px; color: var(--ink-3); letter-spacing: .12em; margin: 0 4px 7px; }
.list-card { background: var(--card); border: 1px solid var(--line-soft); border-radius: 13px; overflow: hidden; }
.set-row {
  width: 100%;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 13px;
  text-align: left;
  background: transparent;
  transition: background .14s;
}
.set-row + .set-row { border-top: 1px solid var(--line-soft); }
.set-row:active { background: var(--paper-2); }
.set-ico { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--paper-2); color: var(--ink-2); }
.set-ico svg { width: 15px; height: 15px; }
.set-main { flex: 1; min-width: 0; }

.set-row.danger .set-ico { background: var(--red-soft); }
.chev { width: 14px; height: 14px; color: var(--ink-4); }

.btn {
  height: 46px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: 6px;

}
.btn:active { transform: scale(.985); }
.btn-primary { background: var(--ink); color: var(--paper); flex: 1; }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink-2); flex: 1; }
.btn-danger { background: var(--red); color: #fff; flex: 1; }
.btn-block { width: 100%; }

.about { padding: 4px 2px 2px; font-size: 11.5px; color: var(--ink-3); line-height: 1.7; }
.about b { color: var(--ink-2); font-weight: 500; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 12px; border-bottom: 1px solid var(--line-soft); }
.kv:last-child { border-bottom: 0; }
.kv span:first-child { color: var(--ink-3); }
.kv span:last-child { color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* 分类管理 */
.cat-manage { display: flex; flex-direction: column; }
.cm-row { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line-soft); }
.cm-dot { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--c); background: var(--c-soft, var(--paper-2)); }
.cm-dot svg { width: 14px; height: 14px; }
.cm-name { font-size: 13.5px; }
.cm-count { margin-left: auto; font-size: 10.5px; color: var(--ink-3); }
.cm-del { font-size: 11px; color: var(--red); padding: 6px 4px 6px 10px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; background: var(--c); border: 2px solid transparent; }
.swatch.on { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--paper); }

/* toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(148px + var(--safe-b));
  transform: translate(-50%, 14px);
  display: flex; align-items: center; gap: 12px;
  max-width: calc(100vw - 40px);
  padding: 10px 14px;
  border-radius: 11px;
  background: rgba(27, 24, 21, .94);
  color: var(--paper);
  font-size: 12.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s var(--ease), transform .22s var(--ease);
  z-index: 80;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: #E9A08F; font-size: 12.5px; font-weight: 600; white-space: nowrap; }

/* 编辑弹层 */
.edit-cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.edit-cats::-webkit-scrollbar { display: none; }

@media (max-height: 780px) {
  .amount-block { padding-top: 6px; }
  .amount { height: 56px; }
  .amount-val { font-size: 47px; }
  .amount-cur { font-size: 19px; }
  .cat { height: 60px; }
  .cat-ico { width: 26px; height: 26px; }
  .pad { min-height: 200px; }
  .today-line { padding-top: 8px; }

}
@media (max-height: 690px) {
  .amount-hint { display: none; }
  .amount { height: 50px; }

  .cat { height: 54px; }
  .cat-ico { width: 23px; height: 23px; }
  .cat-name { font-size: 10px; }
  .pad { min-height: 190px; }
  .today-line { display: none; }

}

  flex: 0 0 auto;

}

.today-line b { font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ---------- 补充：说明、空态、示例 ---------- */
.confirm-text { font-size: 13.5px; color: var(--ink-2); line-height: 1.75; margin: 6px 0 12px; }
.hint-text { margin: 9px 3px 0; font-size: 10.5px; color: var(--ink-3); line-height: 1.65; letter-spacing: .01em; }

}

.welcome { padding: 6px 2px 2px; }
.welcome-mark {
  width: 38px; height: 38px; border-radius: 11px;
  background: var(--ink); position: relative; margin-bottom: 18px;
}
.welcome-mark::before {
  content: ""; position: absolute; left: 9px; right: 9px; top: 13px; height: 1px;
  background: rgba(245, 240, 229, .5);

}
.welcome-mark span {

  background: var(--accent); right: -4px; bottom: -4px; border: 2px solid var(--paper);
}
.welcome-title {
  font-family: var(--serif);

}

.welcome-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 11px; }

}

}

.sheet--tall { max-height: 94dvh; }


/* ========================================================================
   松墨 · 月结单 skin
   ======================================================================== */
.label { font-size: 11px; letter-spacing: .16em; color: var(--ink-3); text-transform: uppercase; }
.num { font-variant-numeric: tabular-nums lining-nums; }

/* 顶栏 */
.top { display: block; padding: 14px 18px 0; gap: 0; }
.brandline { display: flex; align-items: center; justify-content: space-between; }
.brand { font-size: 11px; letter-spacing: .2em; color: var(--ink-2); }
.top-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 15px; min-width: 0; }
.top-title { font-family: var(--serif); font-size: 25px; font-weight: 500; line-height: 1; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-sub { margin-top: 0; font-size: 11px; color: var(--ink-3); text-align: right; white-space: nowrap; letter-spacing: .02em; }
.top-rule { height: 1px; background: var(--line); margin-top: 12px; }

/* 记账 */
.amount-block { padding: 14px 18px 0; }
.amount { display: flex; align-items: baseline; gap: 4px; height: auto; margin-top: 6px; font-family: var(--serif); font-size: 50px; line-height: 1.04; letter-spacing: -.02em; }

.amount-hint { height: 16px; padding-left: 0; margin-top: 5px; font-size: 10.5px; color: var(--ink-3); }

.catlabel { display: flex; align-items: baseline; justify-content: space-between; padding: 0 18px; margin-top: 13px; }
.cats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; padding: 5px 14px 0; margin: 0; max-height: none; overflow: visible; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cat { position: relative; height: 62px; border-radius: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-2); transition: background .16s var(--ease), color .16s var(--ease); }

.today-line { display: flex; align-items: center; gap: 6px; padding: 9px 18px 0; margin: 0; font-size: 11px; color: var(--ink-3); letter-spacing: .02em; }

.pad { flex: 0 0 auto; height: auto; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--line); margin: auto 0 0; padding: 0; }
.key { height: 56px; display: grid; place-items: center; border: 0; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: 0; background: transparent; font-family: var(--serif); font-size: 23px; font-weight: 500; color: var(--ink); }

.save { flex: 0 0 auto; margin: 10px 18px 8px; height: 52px; border-radius: 2px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 500; letter-spacing: .12em; }

/* tab */
.tabbar { display: grid; grid-template-columns: repeat(3, 1fr); align-items: stretch; padding: 0; height: calc(54px + var(--safe-b)); padding-bottom: var(--safe-b); border-top: 1px solid var(--ink); background: var(--paper); }

.chips { gap: 16px; padding: 10px 34px 0 18px; border-bottom: 1px solid var(--line); mask-image: linear-gradient(90deg, #000 calc(100% - 20px), transparent); -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 20px), transparent); }

.scroll { padding-bottom: 14px; }

/* 报告 */

.spark { width: 100%; height: 64px; display: block; margin-top: 10px; overflow: visible; }
.spark .line { fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linejoin: round; }
.spark .area { fill: rgba(47, 90, 67, .06); }
.spark .dot { fill: var(--warn); }

.spark-x { display: flex; justify-content: space-between; margin-top: 4px; font-size: 9.5px; color: var(--ink-3); }

/* 设置 / 表单 */

.btn { border-radius: 2px; height: 46px; font-size: 14px; }
.btn-primary { background: var(--accent); color: var(--on-accent); }

.btn-danger { background: var(--warn); color: var(--on-accent); }

.input:focus { border-color: var(--accent); outline: none; }

</head>

  <header class="top">

<script>
/* 花在哪 · 数据层（纯函数，可在浏览器与 Node 中共用） */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  root.HZCore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const VERSION = '1.2.0';
  const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  const CATS = [
    { id: 'food',   name: '餐饮', color: '#9C6A2A', icon: 'bowl' },
    { id: 'transit',name: '交通', color: '#3D6B57', icon: 'bus' },
    { id: 'shop',   name: '购物', color: '#9B4F58', icon: 'bag' },
    { id: 'home',   name: '居住', color: '#5D6B3E', icon: 'home' },
    { id: 'fun',    name: '娱乐', color: '#6A5A86', icon: 'ticket' },
    { id: 'med',    name: '医疗', color: '#9A3E35', icon: 'cross' },
    { id: 'study',  name: '学习', color: '#2F6B64', icon: 'book' },
    { id: 'social', name: '人情', color: '#A97834', icon: 'gift' },
    { id: 'phone',  name: '通讯', color: '#4C5A63', icon: 'phone' },
    { id: 'other',  name: '其他', color: '#7A7263', icon: 'dots' }
  ];


  const INCOME_CATS = [
    { id: 'in_salary',    name: '工资', color: '#2F5A43', icon: 'wallet' },
    { id: 'in_bonus',     name: '奖金', color: '#A97834', icon: 'award' },
    { id: 'in_invest',    name: '理财', color: '#3D6B57', icon: 'trend' },
    { id: 'in_side',      name: '兼职', color: '#6A5A86', icon: 'briefcase' },
    { id: 'in_reimburse', name: '报销', color: '#4C5A63', icon: 'receipt' },
    { id: 'in_gift',      name: '礼金', color: '#9B4F58', icon: 'gift' },
    { id: 'in_refund',    name: '退款', color: '#5D6B3E', icon: 'refund' },
    { id: 'in_rent',      name: '租金', color: '#9C6A2A', icon: 'home' },
    { id: 'in_dividend',  name: '分红', color: '#2F6B64', icon: 'coins' },
    { id: 'in_other',     name: '其他', color: '#7A7263', icon: 'dots' }
  ];

  function isIncomeCat(id) {
    return String(id || '').indexOf('in_') === 0;
  }

  function kindOf(r) {
    if (!r) return 'expense';
    if (r.kind === 'income' || r.kind === 'expense') return r.kind;
    return isIncomeCat(r.cat) ? 'income' : 'expense';
  }

  function catsFor(kind, custom) {
    if (kind === 'income') return INCOME_CATS;
    const list = custom && custom.length ? custom : CATS;
    return list.filter(function (c) { return !isIncomeCat(c.id); });
  }

  const PAYS = [
    { id: 'wechat', name: '微信' },
    { id: 'alipay', name: '支付宝' },
    { id: 'card',   name: '银行卡' },
    { id: 'cash',   name: '现金' },
    { id: 'other',  name: '其他' }
  ];

  const COLOR_PICKS = ['#9C6A2A', '#3D6B57', '#9B4F58', '#5D6B3E', '#6A5A86',
    '#9A3E35', '#2F6B64', '#A97834', '#4C5A63', '#7A7263', '#B08A52', '#6B6254'];

  function pad2(n) { return String(n).padStart(2, '0'); }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function isoOf(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function todayISO() { return isoOf(new Date()); }

  function parseISO(s) {
    const p = String(s).split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }

  function addDays(iso, n) {
    const d = parseISO(iso);
    d.setDate(d.getDate() + n);
    return isoOf(d);
  }

  function mondayOf(iso) {
    const d = parseISO(iso);
    const wd = (d.getDay() + 6) % 7; // 周一=0
    d.setDate(d.getDate() - wd);
    return isoOf(d);
  }

  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

  function rangeOf(kind, anchor) {
    const d = parseISO(anchor);
    const y = d.getFullYear();
    const m = d.getMonth();
    if (kind === 'day') return { start: anchor, end: anchor };
    if (kind === 'week') {
      const start = mondayOf(anchor);
      return { start, end: addDays(start, 6) };
    }
    if (kind === 'month') {
      return { start: isoOf(new Date(y, m, 1)), end: isoOf(new Date(y, m + 1, 0)) };
    }
    return { start: isoOf(new Date(y, 0, 1)), end: isoOf(new Date(y, 11, 31)) };
  }

  function shiftAnchor(kind, anchor, delta) {
    const d = parseISO(anchor);
    if (kind === 'day') return addDays(anchor, delta);
    if (kind === 'week') return addDays(anchor, delta * 7);
    if (kind === 'month') {
      d.setDate(1);
      d.setMonth(d.getMonth() + delta);
      return isoOf(d);
    }
    d.setMonth(0, 1);
    d.setFullYear(d.getFullYear() + delta);
    return isoOf(d);
  }

  function fmtDate(iso, withWeek) {
    const d = parseISO(iso);
    let s = (d.getMonth() + 1) + '月' + d.getDate() + '日';
    if (withWeek) s += ' ' + WEEKDAYS[d.getDay()];
    return s;
  }

  function labelOf(kind, anchor) {
    const r = rangeOf(kind, anchor);
    const d = parseISO(anchor);
    if (kind === 'day') return d.getFullYear() + '年' + fmtDate(anchor, true);
    if (kind === 'week') {
      const a = parseISO(r.start), b = parseISO(r.end);
      const sameYear = a.getFullYear() === b.getFullYear();
      const head = sameYear ? '' : a.getFullYear() + '年';
      return head + (a.getMonth() + 1) + '月' + a.getDate() + '日 – '
        + (b.getMonth() + 1) + '月' + b.getDate() + '日';
    }
    if (kind === 'month') return d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
    return d.getFullYear() + '年';
  }

  function period(kind, anchor) {
    return { kind, anchor, range: rangeOf(kind, anchor), label: labelOf(kind, anchor) };
  }

  function prevAnchor(kind, anchor) { return shiftAnchor(kind, anchor, -1); }

  function money(cents) {
    const neg = cents < 0;
    const v = Math.abs(Math.round(cents));
    const yuan = Math.floor(v / 100);
    const fen = v % 100;
    const s = String(yuan).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + pad2(fen);
    return (neg ? '-' : '') + s;
  }

  function toCents(text) {
    const t = String(text == null ? '' : text).replace(/[^\d.]/g, '');
    if (!t) return 0;
    const n = Number(t);
    if (!isFinite(n) || n <= 0) return 0;
    return Math.round(n * 100);
  }

  function catById(cats, id) {
    let c = (cats || []).find(function (x) { return x.id === id; });
    if (!c) c = INCOME_CATS.find(function (x) { return x.id === id; });
    if (!c) c = { id: 'other', name: '其他', color: '#7A7263', icon: 'dots' };
    return c;
  }

  function payName(id) {
    const p = PAYS.find(function (x) { return x.id === id; });
    return p ? p.name : '其他';
  }

  /* 汇总一段区间 */
  function summarize(records, start, end) {
    const list = records.filter(function (r) { return r.date >= start && r.date <= end; });
    const byCat = {}, byPay = {}, byDay = {};
    let total = 0, max = null;
    for (let i = 0; i < list.length; i++) {
      const r = list[i];
      total += r.amt;
      byCat[r.cat] = (byCat[r.cat] || 0) + r.amt;
      byPay[r.pay || 'other'] = (byPay[r.pay || 'other'] || 0) + r.amt;
      byDay[r.date] = (byDay[r.date] || 0) + r.amt;
      if (!max || r.amt > max.amt) max = r;
    }
    return { list: list, total: total, count: list.length, byCat: byCat, byPay: byPay, byDay: byDay, max: max };
  }

  function ranking(sum, cats) {
    return Object.keys(sum.byCat).map(function (id) {
      const cat = catById(cats, id);
      return { id: id, name: cat.name, color: cat.color, icon: cat.icon, amt: sum.byCat[id],
        pct: sum.total ? sum.byCat[id] / sum.total * 100 : 0 };
    }).sort(function (a, b) { return b.amt - a.amt; });
  }

  function payRanking(sum) {
    return Object.keys(sum.byPay).map(function (id) {
      return { id: id, name: payName(id), amt: sum.byPay[id],
        pct: sum.total ? sum.byPay[id] / sum.total * 100 : 0 };
    }).sort(function (a, b) { return b.amt - a.amt; });
  }

  function series(kind, range, byDay) {
    const out = [];
    if (kind === 'day') return out;
    if (kind === 'week') {
      const start = range.start;
      for (let i = 0; i < 7; i++) {
        const iso = addDays(start, i);
        const d = parseISO(iso);
        out.push({ key: iso, label: '周' + ['一', '二', '三', '四', '五', '六', '日'][i],
          short: WEEKDAYS[d.getDay()].slice(1), value: byDay[iso] || 0, show: true });
      }
      return out;
    }
    if (kind === 'month') {
      const d = parseISO(range.start);
      const n = daysInMonth(d.getFullYear(), d.getMonth() + 1);
      for (let i = 1; i <= n; i++) {
        const iso = isoOf(new Date(d.getFullYear(), d.getMonth(), i));
        out.push({ key: iso, label: String(i), value: byDay[iso] || 0,
          show: i === 1 || i === n || (i % 5 === 0 && i <= n - 2) });
      }
      return out;
    }
    const y = parseISO(range.start).getFullYear();
    for (let m = 1; m <= 12; m++) {
      let v = 0;
      Object.keys(byDay).forEach(function (iso) {
        if (Number(iso.slice(0, 4)) === y && Number(iso.slice(5, 7)) === m) v += byDay[iso];
      });
      out.push({ key: y + '-' + pad2(m), label: m + '月', value: v, show: true });
    }
    return out;
  }

  function delta(cur, prev) {
    if (!prev) return { pct: null, dir: cur > 0 ? 'up' : 'flat' };
    const pct = (cur - prev) / prev * 100;
    return { pct: pct, dir: pct > 0.5 ? 'up' : pct < -0.5 ? 'down' : 'flat' };
  }

  function periodDays(kind, range) {
    if (kind === 'day') return 1;
    const a = parseISO(range.start), b = parseISO(range.end);
    return Math.round((b - a) / 86400000) + 1;
  }

  /* CSV：带 BOM，Excel 直接打开 */
  function csv(records, cats) {
    const esc = function (v) {
      const s = String(v == null ? '' : v);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const header = ['日期', '月份', '类型', '分类', '金额', '支付方式', '备注'];
    const rows = records.slice().sort(function (a, b) {
      return a.date === b.date ? (a.ts || 0) - (b.ts || 0) : (a.date < b.date ? -1 : 1);
    }).map(function (r) {
      return [r.date, r.date.slice(0, 7), kindOf(r) === 'income' ? '收入' : '支出',
        catById(cats, r.cat).name, (r.amt / 100).toFixed(2), payName(r.pay), r.note || '']
        .map(esc).join(',');
    });
    return '\ufeff' + [header.join(',')].concat(rows).join('\r\n') + '\r\n';
  }

  function summaryText(kind, anchor, sum, cats) {
    const r = ranking(sum, cats);
    const top = r[0];
    if (!top) return labelOf(kind, anchor) + '还没有记账。';
    return labelOf(kind, anchor) + '共花 ¥' + money(sum.total) + '，' + top.name + '最多，占 '
      + Math.round(top.pct) + '%。';
  }

  function backup(records, cats, now) {
    return JSON.stringify({
      app: '花在哪', version: VERSION, exportedAt: new Date(now || Date.now()).toISOString(),
      records: records, cats: cats
    }, null, 2);
  }

  function normalizeBackup(obj) {
    if (!obj || !Array.isArray(obj.records)) throw new Error('不是「花在哪」的备份文件');
    const records = obj.records.filter(function (r) {
      return r && typeof r.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.date)
        && Number.isFinite(Number(r.amt)) && Number(r.amt) > 0;
    }).map(function (r) {
      return {
        id: String(r.id || uid()),
        amt: Math.round(Number(r.amt)),
        cat: String(r.cat || 'other'),
        date: r.date,
        pay: r.pay ? String(r.pay) : 'other',
        note: typeof r.note === 'string' ? r.note.slice(0, 80) : '',
        kind: kindOf(r),
        ts: Number(r.ts) || 0
      };
    });
    const cats = Array.isArray(obj.cats) ? obj.cats.filter(function (c) {
      return c && c.id && c.name;
    }).map(function (c) {
      return { id: String(c.id), name: String(c.name).slice(0, 8),
        color: /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : '#7B7568',
        icon: String(c.icon || 'dots'), custom: !!c.custom };
    }) : [];
    return { records: records, cats: cats };
  }

  /* 示例数据：固定种子，保证每次一致 */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function sampleRecords(today) {
    const rnd = mulberry32(20261102);
    const pick = function (arr) { return arr[Math.floor(rnd() * arr.length)]; };
    const notes = {
      food: ['早饭 豆浆油条', '公司楼下简餐', '和朋友吃火锅', '咖啡', '外卖', '超市买菜', '面馆'],
      transit: ['地铁', '公交', '打车', '共享单车月卡', '高铁票'],
      shop: ['洗衣液 + 纸巾', '一件外套', '耳机', '日用品', '快递'],
      home: ['水电燃气', '网费', '物业费', '日用品'],
      fun: ['电影票', '演出', '游戏', '周末爬山'],
      med: ['感冒药', '门诊挂号', '体检'],
      study: ['技术书', '网课', '订阅'],
      social: ['朋友生日礼物', '同事份子钱', '请客吃饭'],
      phone: ['话费充值', '流量包'],
      other: ['理发', '捐款', '停车费']
    };
    const range = { food: [1200, 8800], transit: [300, 2600], shop: [2000, 26000],
      home: [8000, 34000], fun: [3000, 18000], med: [1500, 12000], study: [3000, 20000],
      social: [5000, 40000], phone: [2000, 10000], other: [500, 5000] };
    const pays = ['wechat', 'alipay', 'alipay', 'wechat', 'card', 'cash'];
    const ids = CATS.map(function (c) { return c.id; });
    const out = [];
    const end = parseISO(today);
    for (let i = 0; i < 78; i++) {
      const d = new Date(end.getFullYear(), end.getMonth(), end.getDate());
      d.setDate(d.getDate() - i);
      const dow = d.getDay();
      const isWeekend = dow === 0 || dow === 6;
      const n = i === 0 ? 2 : Math.max(1, (isWeekend ? 2 : 2) + (rnd() < 0.35 ? 1 : 0));
      for (let k = 0; k < n; k++) {
        let cat, amt, note;
        if (d.getDate() === 1 && k === 0) {
          // 每月一号一笔房租
          cat = 'home'; amt = 320000; note = '房租';
        } else {
          cat = pick(ids);
          if (cat === 'home') {
            amt = Math.round((8000 + rnd() * 26000) / 100) * 100;
          } else {
            const r = range[cat];
            amt = Math.round((r[0] + rnd() * (r[1] - r[0])) / 100) * 100;
          }
          note = pick(notes[cat]);
        }
        out.push({
          id: 's' + i + '_' + k, amt: amt, cat: cat, date: isoOf(d), pay: pick(pays),
          note: note,
          ts: new Date(d.getFullYear(), d.getMonth(), d.getDate(),
            7 + Math.floor(rnd() * 14), Math.floor(rnd() * 60)).getTime()
        });
      }
    }
    return out.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : b.ts - a.ts; });
  }

  return {
    VERSION: VERSION, WEEKDAYS: WEEKDAYS, CATS: CATS, INCOME_CATS: INCOME_CATS,
    PAYS: PAYS, COLOR_PICKS: COLOR_PICKS,
    uid: uid, isoOf: isoOf, todayISO: todayISO, parseISO: parseISO, addDays: addDays,
    mondayOf: mondayOf, rangeOf: rangeOf, shiftAnchor: shiftAnchor, labelOf: labelOf,
    period: period, prevAnchor: prevAnchor, fmtDate: fmtDate, money: money, toCents: toCents,
    catById: catById, isIncomeCat: isIncomeCat, kindOf: kindOf, catsFor: catsFor,
    payName: payName, summarize: summarize, ranking: ranking,
    payRanking: payRanking, series: series, delta: delta, periodDays: periodDays,
    csv: csv, summaryText: summaryText, backup: backup, normalizeBackup: normalizeBackup,
    sampleRecords: sampleRecords
  };
});
