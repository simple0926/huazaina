<!DOCTYPE html>
<html lang="zh-CN" data-store="huazaina-v1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F1EEE0">
<title>花在哪</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brandline">
      <span class="brand" id="brandline">花在哪</span>
      <button class="icon-btn" id="btnSettings" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 14.6a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.88 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.88.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.88V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="top-row">
      <h1 class="top-title" id="topTitle">花在哪</h1>
      <div class="top-sub" id="topSub">数据只在本机</div>
    </div>
    <div class="top-rule"></div>
  </header>

  <main id="main">
    <section class="view is-on" data-view="add">
      <div class="amount-block">
        <div class="amount-head"><span class="label">金额 / AMOUNT</span>
          <div class="kindswitch" id="kindSwitch">
            <button data-kind="expense" class="on">支出</button>
            <button data-kind="income">收入</button>
          </div>
        </div>
        <div class="amount" id="amount"><span class="amount-cur">¥</span><span class="amount-val" id="amountVal">0.00</span><i class="caret" id="caret"></i></div>
        <div class="amount-rule"></div>
        <div class="amount-hint" id="amountHint">输入金额，选个分类</div>
      </div>

      <div class="catlabel"><span class="label" id="catLabel">分类 / CATEGORY</span></div>
      <div class="cats" id="catGrid"></div>

      <div class="meta">
        <button class="meta-btn" id="btnDate"><span class="mk">日期</span><span class="mv" id="metaDate">今天</span></button>
        <button class="meta-btn" id="btnNote"><span class="mk">备注</span><span class="mv" id="metaNote">无</span></button>
        <button class="meta-btn" id="btnPay"><span class="mk" id="payLabel">付款</span><span class="mv" id="metaPay">微信</span></button>
      </div>

      <div class="today-line" id="todayLine"></div>

      <div class="pad" id="keypad">
        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key" data-k=".">.</button>
        <button class="key" data-k="0">0</button>
        <button class="key key-back" data-k="back" aria-label="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H9.5L4 12l5.5 6H20a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 20 6z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>
        </button>
      </div>

      <button class="save" id="saveBtn" disabled>记下这笔</button>
    </section>

    <section class="view" data-view="list"></section>
    <section class="view" data-view="report"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab is-on" data-tab="add">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4.2-1L19 8.2a2.1 2.1 0 0 0-3-3L5.2 16 4 20z"/><path d="M13.8 6.4l3.8 3.8"/></svg></span>
      <span class="tab-label"><b>01</b>记账</span>
    </button>
    <button class="tab" data-tab="list">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 7h12M8 12h12M8 17h12"/><circle cx="4" cy="7" r=".9" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r=".9" fill="currentColor" stroke="none"/><circle cx="4" cy="17" r=".9" fill="currentColor" stroke="none"/></svg></span>
      <span class="tab-label"><b>02</b>明细</span>
    </button>
    <button class="tab" data-tab="report">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-5"/></svg></span>
      <span class="tab-label"><b>03</b>报告</span>
    </button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">标题</h2>
    <button class="sheet-close" id="sheetClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="toastAction" hidden></button></div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
